[project]
name = "parley-protocol"
version = "0.1.0"
description = "Parley protocol: independent Python implementation"
readme = "README.md"
authors = [
    { name = "James Solomon", email = "solomonjames@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50.0.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "parley"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
