name: release
# Push a tag like v0.1.1 to publish both packages. npm uses provenance (OIDC trusted
# publishing, or an NPM_TOKEN secret as fallback); PyPI uses trusted publishing (OIDC).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci && npm run build && npm test
        env:
          SKIP_INTEROP: "1"
      - run: npm publish --provenance --access public
        working-directory: ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
  github-release:
    needs: [npm, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag || true
        env:
          GH_TOKEN: ${{ github.token }}
